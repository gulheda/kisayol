<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kısayol — hızlı erişim sayfam</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2306b6d4'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' font-family='Georgia,serif' fill='%23032e33'%3Ek%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<header class="topbar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="text" placeholder="Link ara..." autocomplete="off">
    <kbd class="search-kbd">/</kbd>
  </div>

  <div class="topbar-actions">
    <button id="themeToggle" class="icon-btn" title="Temayı değiştir" aria-label="Temayı değiştir">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8l1.8-1.8M18 6l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <button id="menuToggle" class="icon-btn" title="Ayarlar" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
    </button>
    <div id="menuDropdown" class="menu-dropdown hidden">
      <button id="manageCategoriesBtn">Başlıkları yönet</button>
      <button id="resetBtn" class="danger">Tümünü sıfırla</button>
    </div>
    <button id="addCategoryBtn" class="add-btn ghost-btn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Başlık</span>
    </button>
    <button id="addLinkBtn" class="add-btn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Yeni Link</span>
    </button>
  </div>
</header>

<main class="page">
  <section class="hero">
    <p class="hero-clock" id="clock">--:--</p>
  </section>

  <section class="lists-section">
    <div id="categoriesContainer"></div>
    <div id="emptyState" class="empty-state hidden">
      <p class="empty-emoji">✦</p>
      <p class="empty-title">Henüz link yok</p>
      <p class="empty-sub">Bir başlık altında ilk linkini ekleyerek başlangıç sayfanı oluştur.</p>
      <button class="add-btn" id="emptyAddBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span>İlk linkini ekle</span>
      </button>
    </div>
  </section>
</main>


<!-- Link ekle/düzenle modal -->
<div class="modal-overlay hidden" id="linkModalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="linkModalTitle">
    <div class="modal-head">
      <h3 id="linkModalTitle">Yeni Link</h3>
      <button class="icon-btn modal-close" id="linkModalClose" aria-label="Kapat">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="linkForm">
      <input type="hidden" id="linkId">
      <label class="field">
        <span>Adres (URL)</span>
        <input type="text" id="linkUrl" placeholder="ör. github.com" required>
      </label>
      <label class="field">
        <span>Site adı (isteğe bağlı)</span>
        <input type="text" id="linkName" placeholder="Boş bırakılırsa adresten alınır">
      </label>
      <label class="field">
        <span>Başlık</span>
        <div class="select-row">
          <select id="linkCategory"></select>
          <button type="button" id="newCategoryInline" class="mini-btn">+ yeni başlık</button>
        </div>
      </label>
      <label class="field emoji-field">
        <span>İkon (isteğe bağlı emoji)</span>
        <input type="text" id="linkEmoji" maxlength="4" placeholder="🔗">
      </label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="linkCancelBtn">Vazgeç</button>
        <button type="submit" class="btn primary">Kaydet</button>
      </div>
    </form>
  </div>
</div>

<!-- Başlık yönetim modal -->
<div class="modal-overlay hidden" id="categoryModalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="catModalTitle">
    <div class="modal-head">
      <h3 id="catModalTitle">Başlıkları Yönet</h3>
      <button class="icon-btn modal-close" id="categoryModalClose" aria-label="Kapat">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="categoryList" class="category-list"></div>
    <form id="newCategoryForm" class="new-category-form">
      <select id="newCategoryParent"></select>
      <div class="new-category-row">
        <input type="text" id="newCategoryName" placeholder="ör. BAUN CENG veya Staj" required>
        <button type="submit" class="btn primary">Ekle</button>
      </div>
    </form>
  </div>
</div>

<!-- Onay modal -->
<div class="modal-overlay hidden" id="confirmOverlay">
  <div class="modal confirm-modal" role="alertdialog" aria-modal="true">
    <p id="confirmMessage">Emin misin?</p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="confirmCancel">Vazgeç</button>
      <button type="button" class="btn danger" id="confirmOk">Sil</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="script.js?v=13"></script>
</body>
</html>
